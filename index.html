<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السيد الخفي 33 — 3D Prototype</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="brand">السيد الخفي 33</div>
    <div class="stage">PROTOTYPE · 3D · المرحلة 01</div>
    <div class="status" id="status">النظام جاهز</div>
  </div>

  <div id="cinematic" class="cinematic">
    <div id="caption"></div>
  </div>

  <div id="intro" class="panel">
    <div class="eyebrow">THE HIDDEN MASTER 33</div>
    <h1>غرفة القرار</h1>
    <p>هذا هو الاختبار الحقيقي للمشهد ثلاثي الأبعاد.</p>
    <p class="muted">اضغط للدخول إلى المشهد.</p>
    <button id="start" type="button">دخول المشهد</button>
  </div>

  <div id="decision" class="decision hidden">
    <div class="decisionCard">
      <div class="eyebrow">القرار الأول</div>
      <h2>العالم ينتظر إشارتك</h2>
      <p>كيف تتعامل مع الأزمة التي ظهرت على الخريطة؟</p>
      <div class="choices">
        <button type="button" data-path="peace">🕊️ فتح باب التفاوض</button>
        <button type="button" data-path="power">⚔️ فرض الاستقرار بالقوة</button>
        <button type="button" data-path="balance">⚖️ إبقاء توازن القوى</button>
        <button type="button" data-path="chaos">🔥 استغلال الفوضى</button>
      </div>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <div class="eyebrow">AFTERMATH</div>
    <h2 id="resultTitle">...</h2>
    <p id="resultText">...</p>
    <button id="again" type="button">إعادة التجربة</button>
  </div>
</div>

<script src="src/main.js"></script>
</body>
</html>
