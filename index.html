<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>السيد الخفي 33 — Cinematic 3D</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <canvas id="scene"></canvas>

    <section id="overlay" class="overlay">
      <div class="topbar">
        <div class="brand">السيد الخفي 33</div>
        <div class="stage" id="stageLabel">الدرجة 01 / 33</div>
      </div>

      <div id="stats" class="stats"></div>

      <div id="narration" class="narration"></div>
      <div id="location" class="location"></div>

      <section id="decision" class="decision hidden">
        <div class="eyebrow">لحظة القرار</div>
        <h1 id="question"></h1>
        <div id="options" class="options"></div>
      </section>

      <section id="intro" class="card">
        <div class="eyebrow">INTERACTIVE 3D STRATEGY</div>
        <h1>السيد الخفي 33</h1>
        <p>نسخة المحرك الجديدة: عالم ثلاثي الأبعاد، كاميرا سينمائية، نظام قرارات، وإضاءة ومؤثرات قابلة للتوسع.</p>
        <button id="start" class="primary">بدء التجربة</button>
      </section>

      <section id="result" class="card hidden">
        <div class="eyebrow">AFTERMATH</div>
        <h1 id="resultTitle"></h1>
        <p id="resultText"></p>
        <button id="continue" class="primary">متابعة</button>
      </section>

      <button id="restart" class="secondary">إعادة من الدرجة 01</button>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
